appId: com.handson.frontend
name: Android 음성 녹음과 일시정지 및 초안 생성
---
- launchApp:
    clearState: true
    permissions:
      microphone: unset
- extendedWaitUntil:
    visible: '연구실: 연구실을 선택해 주세요'
    timeout: 30000
- tapOn: 숙련 연구생, 절차 생성·승인
- tapOn: '연구실: 연구실을 선택해 주세요'
- tapOn: 전자회로 실험실
- tapOn: 설정하고 계속
- tapOn: 새 절차 음성으로 만들기
- assertVisible: 음성 설명 녹음
- tapOn: 절차 이름
# Android Maestro inputText는 유니코드 입력을 지원하지 않습니다.
- inputText: LED output measurement
- hideKeyboard
- takeScreenshot: e02-ready

# 첫 녹음에서 Android 권한 창을 열고 앱 사용 중 마이크 접근을 허용합니다.
- tapOn:
    id: recording-start
- tapOn:
    id: '.*:id/permission_allow_foreground_only_button'
- extendedWaitUntil:
    visible: 녹음 중이에요
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: recording-duration
      text: '녹음 시간 00:(0[2-9]|[1-5][0-9])'
    timeout: 15000
- takeScreenshot: e02-recording
- back
- assertVisible: 녹음을 취소할까요\?
- tapOn: 계속 녹음
- assertVisible: 녹음 중이에요
- tapOn:
    id: recording-pause
- assertVisible: 녹음을 일시정지했어요
- assertVisible: 녹음 재개
- takeScreenshot: e02-paused
- tapOn:
    id: recording-resume
- assertVisible: 녹음 중이에요
- tapOn:
    id: recording-finish
- extendedWaitUntil:
    visible: STT 텍스트 확인
    timeout: 20000
- extendedWaitUntil:
    visible: STT 변환이 완료되었습니다
    timeout: 15000
- assertVisible: LED output measurement
- assertVisible: '.*녹음 길이.*'
- takeScreenshot: e03-transcription
- scrollUntilVisible:
    element: AI 절차 초안 생성
    direction: DOWN
- tapOn: AI 절차 초안 생성
- extendedWaitUntil:
    visible: AI 절차 초안
    timeout: 15000
- assertVisible: LED output measurement
- takeScreenshot: e04-generated-draft
