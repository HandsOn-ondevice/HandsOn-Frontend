- scrollUntilVisible:
    element:
      id: step-criteria-overcurrent-limit
    direction: DOWN
- assertVisible:
    id: step-criteria-overcurrent-limit
    text: '240'
- scrollUntilVisible:
    element:
      id: step-criteria-hold-rule
    direction: DOWN
- assertVisible:
    id: step-criteria-hold-rule
    text: Hold the step
- scrollUntilVisible:
    element:
      id: step-criteria-recovery-rule
    direction: DOWN
- assertVisible:
    id: step-criteria-recovery-rule
    text: Check again
- scrollUntilVisible:
    element:
      id: step-criteria-manual-check
    direction: DOWN
- assertVisible:
    id: step-criteria-manual-check
